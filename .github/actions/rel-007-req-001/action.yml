name: REL-007.REQ-001 (observe)
description: "REL-007.REQ-001 (REL-007 0.0.1): Producers should sign an attestation linking the artifact digest to the source tag and build provenance. Observe only: kept out of the result, never fails the run"
author: ControlPlane for the FINOS OSERA Exchange
# Reads the job environment set by the fitness workflow (see lib/record.sh for the list of OSERA_* variables). No inputs.
runs:
  using: composite
  steps:
    - name: REL-007.REQ-001 (observe)
      shell: bash
      run: |
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/../../../lib/record.sh"
        check_is REL-007 0.0.1 REL-007.REQ-001 REL-007.CHECK-001
        expect "a signed attestation links the digest of the published artifact to $OSERA_TAG and to its build provenance"

        # 1. what this run can see: the patch repository at the tag. The artifact is built and uploaded to the intake
        #    after this run, so its digest is not known here and no attestation of it can be looked up.
        WHY="the artifact digest is not known in the patch repository at $OSERA_TAG (the jar is uploaded to the intake after this run), so an attestation linking it to the tag cannot be checked here"

        # 2. our proposal, collected as observe data: the workflows at the tag that call a build provenance action
        step "listing the workflows at $OSERA_TAG that produce build provenance"
        RC=0
        WORKFLOWS="$(ev git grep -l -E 'actions/attest-build-provenance|slsa-framework/slsa-github-generator' "$OSERA_TAG" -- .github/workflows)" || RC=$?
        if [ "$RC" -gt 1 ]; then
          record not-tested "$WHY; listing the workflows failed (git grep exit $RC)"
          exit 0
        fi

        # 3. the verdict: not tested here, with what was seen
        if [ -z "$WORKFLOWS" ]; then
          record not-tested "$WHY; no workflow at the tag calls actions/attest-build-provenance or slsa-framework/slsa-github-generator"
        else
          record not-tested "$WHY; workflow(s) at the tag that call a build provenance action: $(paste -sd, - <<<"$WORKFLOWS")"
        fi
