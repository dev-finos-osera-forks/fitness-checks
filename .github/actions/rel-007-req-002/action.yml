name: REL-007.REQ-002 (observe)
description: "REL-007.REQ-002 (REL-007 0.0.1): The attestation should reference SBOM, VEX, test evidence, and license audit material for the release. Observe only: kept out of the result, never fails the run"
author: ControlPlane for the FINOS OSERA Exchange
# Reads the job environment set by the fitness workflow (see lib/record.sh for the list of OSERA_* variables). No inputs.
runs:
  using: composite
  steps:
    - name: REL-007.REQ-002 (observe)
      shell: bash
      run: |
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/../../../lib/record.sh"
        check_is REL-007 0.0.1 REL-007.REQ-002 REL-007.CHECK-002
        expect "the signed build attestation of the artifact released at $OSERA_TAG references its SBOM, VEX, test evidence and licence audit"

        # 1. the attestation this requirement reads is the one of REL-007.REQ-001, which cannot be looked up in the
        #    patch repository at the tag: there is nothing to read the references from
        record not-tested "the build attestation of the artifact cannot be looked up in the patch repository at $OSERA_TAG (the artifact digest is not known here, see REL-007.REQ-001), so its references to SBOM, VEX, test evidence and licence audit cannot be read"
